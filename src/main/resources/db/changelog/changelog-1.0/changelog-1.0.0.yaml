  - changeSet:
      # Create timeslot table.
      id: 202501011330
      author: maryamkhan
      runOnChange: true
      changes:
        - createTable:
            tableName: timeslot
            columns:
              - column:
                  name: person_id
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: day
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: reliability
                  type: int
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: flexibility
                  type: int
                  defaultValue: 0
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: timeslot
            columnNames: person_id, day, start_time, end_time
            constraintName: pk_timeslot
        - addForeignKeyConstraint:
            constraintName: timeslot__fk_reliability_code
            baseTableName: timeslot
            baseColumnNames: reliability
            referencedTableName: reliability
            referencedColumnNames: code
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: timeslot__fk_flexibility_code
            baseTableName: timeslot
            baseColumnNames: flexibility
            referencedTableName: flexibility
            referencedColumnNames: code
            onDelete: CASCADE
            onUpdate: CASCADE