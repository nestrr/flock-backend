  - changeSet:
      # Create degree table.
      id: 202501011230
      author: maryamkhan
      runOnChange: true
      changes:
        - createTable:
            # Create degree table
            tableName: degree
            columns:
              - column:
                  name: id
                  type: text
                  defaultValueComputed: gen_random_uuid()::text
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_degree
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: program_code
                  type: text
              - column:
                  name: degree_type_code
                  type: text
        - addUniqueConstraint:
            columnNames: degree_type_code, program_code
            tableName: degree
            constraintName: degree__unique_type_program_combination
        - addForeignKeyConstraint:
            constraintName: degree__fk_program_code
            baseTableName: degree
            baseColumnNames: program_code
            referencedTableName: program
            referencedColumnNames: code
            onDelete: SET NULL
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            constraintName: degree__fk_degree_type
            baseTableName: degree
            baseColumnNames: degree_type_code
            referencedTableName: degree_type
            referencedColumnNames: code
            onDelete: SET NULL
            onUpdate: CASCADE
