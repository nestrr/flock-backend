databaseChangeLog:
  - changeSet:
      # Create standing table.
      id: 202501011225
      author: maryamkhan
      runOnChange: true
      changes:
        - createTable:
            tableName: standing
            columns:
              - column:
                  name: id
                  type: text
                  defaultValueComputed: gen_random_uuid()::text
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_standing
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
